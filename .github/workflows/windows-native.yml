name: Windows Native Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest

    env:
      EXPECTED_MODEL_HASH: 4f3296dcbe4fb932a6ebb7e0cabde9c5b33234be2ec1da07f29d10e7b50975ab
      MODEL_PACKAGE_DIR: release_model/V1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          & ".\.venv\Scripts\python.exe" -m pip install --upgrade pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" -m pip install -e ".[dev,build]"
          & ".\.venv\Scripts\python.exe" -m pip install ordered-set==4.1.0 zstandard==0.25.0

      - name: Run tests
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" -m pytest -q

      - name: Verify and stage frozen predictive model
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" scripts/stage_model.py `
            --model-dir "$env:MODEL_PACKAGE_DIR"

      - name: Prepare Windows standalone spec
        shell: pwsh
        run: |
          Copy-Item "pysidedeploy.spec" "pysidedeploy.windows.spec" -Force

          $spec = Get-Content "pysidedeploy.windows.spec"

          $spec = $spec -replace '^\s*mode\s*=.*$', 'mode = standalone'
          $spec = $spec -replace '^\s*icon\s*=.*$', 'icon ='

          # Nuitka requires Dependency Walker on Windows standalone builds.
          # GitHub Actions is non-interactive, so explicitly allow the download.
          if ($spec -match '^\s*extra_args\s*=') {
            $spec = $spec -replace `
              '^(\s*extra_args\s*=.*)$', `
              '$1 --assume-yes-for-downloads'
          }

          $spec | Set-Content -Encoding UTF8 "pysidedeploy.windows.spec"

          Write-Host "========== WINDOWS SPEC =========="
          Get-Content "pysidedeploy.windows.spec"
          Write-Host "=================================="

      - name: Build Windows standalone application
        shell: pwsh
        run: |
          $env:VIRTUAL_ENV = (Resolve-Path ".venv").Path
          $env:PATH = "$env:VIRTUAL_ENV\Scripts;$env:PATH"

          & ".\.venv\Scripts\pyside6-deploy.exe" `
            --force `
            --verbose `
            --keep-deployment-files `
            -c pysidedeploy.windows.spec

          if ($LASTEXITCODE -ne 0) {
            throw "pyside6-deploy failed."
          }

      - name: Locate executable and run native smoke test
        shell: pwsh
        run: |
          # pyside6-deploy invokes Nuitka with:
          #   --output-dir=src\mlb_hr\deployment
          # For src\mlb_hr\app.py in standalone mode, the canonical Nuitka
          # output is src\mlb_hr\deployment\app.dist\app.exe.
          # Use that canonical output directly instead of the copied build/*.dist folder.
          $bundle = Join-Path $PWD "src\mlb_hr\deployment\app.dist"

          if (-not (Test-Path $bundle)) {
            Write-Host "DEPLOYMENT CONTENTS:"
            Get-ChildItem -Path "src\mlb_hr\deployment" -Recurse -ErrorAction SilentlyContinue
            throw "Canonical Nuitka standalone bundle was not found: $bundle"
          }

          $artifactPath = Join-Path $bundle "app.exe"

          if (Test-Path $artifactPath) {
            $artifact = Get-Item $artifactPath
          }
          else {
            $artifact = Get-ChildItem `
              -Path $bundle `
              -Filter "*.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -notmatch 'QtWebEngineProcess|python|assistant'
              } |
              Select-Object -First 1
          }

          if (-not $artifact) {
            Write-Host "CANONICAL BUNDLE CONTENTS:"
            Get-ChildItem -Path $bundle -Recurse -ErrorAction SilentlyContinue
            throw "No application .exe exists inside canonical Nuitka app.dist."
          }

          Write-Host "=========================================="
          Write-Host "WINDOWS EXECUTABLE FOUND:"
          Write-Host $artifact.FullName
          Write-Host "=========================================="

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build_reports" |
            Out-Null

          & ".\.venv\Scripts\python.exe" scripts/native_smoke.py `
            --artifact "$($artifact.FullName)" `
            --expected-model-hash "$env:EXPECTED_MODEL_HASH" `
            --output "build_reports\windows.json"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows native smoke test failed."
          }

          if (-not (Test-Path "build_reports\windows.json")) {
            throw "windows.json was not created."
          }

          $report = Get-Content "build_reports\windows.json" -Raw |
            ConvertFrom-Json

          if (-not $report.passed) {
            Write-Host "windows.json:"
            Get-Content "build_reports\windows.json"
            throw "windows.json reports passed=false."
          }

          Write-Host "=========================================="
          Write-Host "WINDOWS_NATIVE_SMOKE = PASS"
          Write-Host "=========================================="

          $bundle |
            Out-File `
              -Encoding ascii `
              -FilePath "windows_bundle_path.txt"

      - name: Package Windows standalone application
        shell: pwsh
        run: |
          $bundle = (Get-Content "windows_bundle_path.txt" -Raw).Trim()

          if (-not (Test-Path $bundle)) {
            throw "Bundle does not exist: $bundle"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts" |
            Out-Null

          Compress-Archive `
            -Path (Join-Path $bundle "*") `
            -DestinationPath "artifacts\MLB-HR-Windows.zip" `
            -CompressionLevel Optimal `
            -Force

          Copy-Item `
            "build_reports\windows.json" `
            "artifacts\windows.json" `
            -Force

          Write-Host "=========================================="
          Write-Host "WINDOWS PACKAGE CREATED"
          Write-Host "artifacts\MLB-HR-Windows.zip"
          Write-Host "=========================================="

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLB-HR-Windows-Native
          path: |
            artifacts/MLB-HR-Windows.zip
            artifacts/windows.json
          if-no-files-found: error
