name: Windows Native Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest

    env:
      EXPECTED_MODEL_HASH: 4f3296dcbe4fb932a6ebb7e0cabde9c5b33234be2ec1da07f29d10e7b50975ab
      MODEL_PACKAGE_DIR: release_model/V1.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # V1.2.0's mandatory predictive-regression guard and rollback test
          # both resolve the v1.1.0 tag via real git commands (git diff,
          # git worktree add) -- actions/checkout's default shallow clone
          # does not fetch tags at all, so those fail with "bad revision"/
          # "invalid reference" on a fresh runner even though the app
          # itself is unaffected.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          & ".\.venv\Scripts\python.exe" -m pip install --upgrade pip

      - name: Install project and build dependencies
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" -m pip install -e ".[dev,build]"
          & ".\.venv\Scripts\python.exe" -m pip install ordered-set==4.1.0 zstandard==0.25.0

      - name: Run tests
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" -m pytest -q

      - name: Verify and stage frozen predictive model
        shell: pwsh
        run: |
          & ".\.venv\Scripts\python.exe" scripts/stage_model.py `
            --model-dir "$env:MODEL_PACKAGE_DIR"

      - name: Prepare Windows standalone spec
        shell: pwsh
        run: |
          Copy-Item "pysidedeploy.spec" "pysidedeploy.windows.spec" -Force

          $spec = Get-Content "pysidedeploy.windows.spec"

          $spec = $spec -replace '^\s*mode\s*=.*$', 'mode = standalone'
          $spec = $spec -replace '^\s*icon\s*=.*$', 'icon ='

          # Nuitka requires Dependency Walker on Windows standalone builds.
          # GitHub Actions is non-interactive, so explicitly allow the download.
          if ($spec -match '^\s*extra_args\s*=') {
            $spec = $spec -replace `
              '^(\s*extra_args\s*=.*)$', `
              '$1 --assume-yes-for-downloads'
          }

          $spec | Set-Content -Encoding UTF8 "pysidedeploy.windows.spec"

          Write-Host "========== WINDOWS SPEC =========="
          Get-Content "pysidedeploy.windows.spec"
          Write-Host "=================================="

      - name: Build Windows standalone application
        shell: pwsh
        run: |
          $env:VIRTUAL_ENV = (Resolve-Path ".venv").Path
          $env:PATH = "$env:VIRTUAL_ENV\Scripts;$env:PATH"

          & ".\.venv\Scripts\pyside6-deploy.exe" `
            --force `
            --verbose `
            --keep-deployment-files `
            -c pysidedeploy.windows.spec

          if ($LASTEXITCODE -ne 0) {
            throw "pyside6-deploy failed."
          }

      - name: Locate executable and run native smoke test
        shell: pwsh
        run: |
          # pyside6-deploy invokes Nuitka with:
          #   --output-dir=src\mlb_hr\deployment
          # For src\mlb_hr\app.py in standalone mode, the canonical Nuitka
          # output is src\mlb_hr\deployment\app.dist\app.exe.
          # Use that canonical output directly instead of the copied build/*.dist folder.
          $bundle = Join-Path $PWD "src\mlb_hr\deployment\app.dist"

          if (-not (Test-Path $bundle)) {
            Write-Host "DEPLOYMENT CONTENTS:"
            Get-ChildItem -Path "src\mlb_hr\deployment" -Recurse -ErrorAction SilentlyContinue
            throw "Canonical Nuitka standalone bundle was not found: $bundle"
          }

          $artifactPath = Join-Path $bundle "app.exe"

          if (Test-Path $artifactPath) {
            $artifact = Get-Item $artifactPath
          }
          else {
            $artifact = Get-ChildItem `
              -Path $bundle `
              -Filter "*.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -notmatch 'QtWebEngineProcess|python|assistant'
              } |
              Select-Object -First 1
          }

          if (-not $artifact) {
            Write-Host "CANONICAL BUNDLE CONTENTS:"
            Get-ChildItem -Path $bundle -Recurse -ErrorAction SilentlyContinue
            throw "No application .exe exists inside canonical Nuitka app.dist."
          }

          Write-Host "=========================================="
          Write-Host "WINDOWS EXECUTABLE FOUND:"
          Write-Host $artifact.FullName
          Write-Host "=========================================="

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build_reports" |
            Out-Null

          & ".\.venv\Scripts\python.exe" scripts/native_smoke.py `
            --artifact "$($artifact.FullName)" `
            --expected-model-hash "$env:EXPECTED_MODEL_HASH" `
            --output "build_reports\windows.json"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows native smoke test failed."
          }

          if (-not (Test-Path "build_reports\windows.json")) {
            throw "windows.json was not created."
          }

          $report = Get-Content "build_reports\windows.json" -Raw |
            ConvertFrom-Json

          if (-not $report.passed) {
            Write-Host "windows.json:"
            Get-Content "build_reports\windows.json"
            throw "windows.json reports passed=false."
          }

          Write-Host "=========================================="
          Write-Host "WINDOWS_NATIVE_SMOKE = PASS"
          Write-Host "=========================================="

          $bundle |
            Out-File `
              -Encoding ascii `
              -FilePath "windows_bundle_path.txt"

      - name: Package Windows standalone application
        shell: pwsh
        run: |
          $bundle = (Get-Content "windows_bundle_path.txt" -Raw).Trim()

          if (-not (Test-Path $bundle)) {
            throw "Bundle does not exist: $bundle"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts" |
            Out-Null

          Copy-Item "packaging\windows\MLB HR.bat" (Join-Path $bundle "MLB HR.bat") -Force
          Copy-Item "packaging\windows\SELF TEST.bat" (Join-Path $bundle "SELF TEST.bat") -Force
          Copy-Item "packaging\windows\README-WINDOWS.txt" (Join-Path $bundle "README-WINDOWS.txt") -Force

          # This base zip is CI plumbing only (consumed by
          # scripts/create_windows_full_release.sh, which bundles real local
          # Statcast on top of it). It must never be treated as a publishable
          # release asset -- it has no runtime_data/statcast. That gap is exactly
          # what shipped broken in MLB-HR-Windows-v1.0.0.zip.
          Compress-Archive `
            -Path (Join-Path $bundle "*") `
            -DestinationPath "artifacts\MLB-HR-Windows-App.zip" `
            -CompressionLevel Optimal `
            -Force

          Write-Host "=========================================="
          Write-Host "WINDOWS BASE PACKAGE CREATED (not release-ready, no Statcast)"
          Write-Host "artifacts\MLB-HR-Windows-App.zip"
          Write-Host "=========================================="

      - name: Assemble and gate Windows FULL package (CI fixture Statcast)
        shell: pwsh
        run: |
          # The real, proprietary Statcast dataset (734MB) lives only on the
          # release engineer's machine and is gitignored -- it cannot and should
          # not be shipped to CI. This step instead proves the FULL assembly +
          # packaging + self-test chain actually works end-to-end, against the
          # real compiled app.exe, using a tiny fixture checked into the repo at
          # tests/fixtures/statcast_ci_fixture. If this step is broken, the real
          # local release build (with real Statcast) would be broken too -- so
          # this is a real regression gate, not a rubber stamp.
          $bundle = (Get-Content "windows_bundle_path.txt" -Raw).Trim()
          $appVersion = (& ".\.venv\Scripts\python.exe" -c "import mlb_hr; print(mlb_hr.__version__)").Trim()
          $modelVersion = ($env:MODEL_PACKAGE_DIR -split '[\\/]')[-1]

          $selfTestCmd = ('["' + $bundle.Replace('\','\\') + '\\app.exe", "--self-test", "--require-runtime-data"]')

          & ".\.venv\Scripts\python.exe" scripts/windows_full_package.py build `
            --bundle-dir "$bundle" `
            --statcast-src "tests\fixtures\statcast_ci_fixture" `
            --output-zip "artifacts\MLB-HR-Windows-FULL-CI-FIXTURE.zip" `
            --manifest-path "artifacts\full-release-manifest.json" `
            --app-version "$appVersion" `
            --model-version "$modelVersion" `
            --model-hash "$env:EXPECTED_MODEL_HASH" `
            --release-commit "$env:GITHUB_SHA" `
            --self-test-cmd $selfTestCmd

          if ($LASTEXITCODE -ne 0) {
            throw "Windows FULL package assembly/self-test gate failed: statcast_runtime_available was not confirmed true. This run CANNOT be used as a release source."
          }

          & ".\.venv\Scripts\python.exe" scripts/windows_full_package.py validate `
            --zip "artifacts\MLB-HR-Windows-FULL-CI-FIXTURE.zip"

          if ($LASTEXITCODE -ne 0) {
            throw "Windows FULL package failed post-build validation."
          }

          $manifest = Get-Content "artifacts\full-release-manifest.json" -Raw | ConvertFrom-Json
          if (-not $manifest.statcast_runtime_available) {
            throw "statcast_runtime_available must be true in the FULL package manifest."
          }

          Write-Host "=========================================="
          Write-Host "WINDOWS FULL GATE = PASS (fixture Statcast, real app.exe)"
          Write-Host "statcast_runtime_available: $($manifest.statcast_runtime_available)"
          Write-Host "statcast_parquet_count: $($manifest.statcast_parquet_count)"
          Write-Host "=========================================="

      - name: Finalize windows.json gate report
        shell: pwsh
        run: |
          $report = Get-Content "build_reports\windows.json" -Raw | ConvertFrom-Json
          $manifest = Get-Content "artifacts\full-release-manifest.json" -Raw | ConvertFrom-Json

          $report | Add-Member -NotePropertyName "full_package_manifest" -NotePropertyValue $manifest -Force
          $report.checks | Add-Member -NotePropertyName "statcast_runtime_available" -NotePropertyValue ([bool]$manifest.statcast_runtime_available) -Force

          $allChecks = $report.checks.PSObject.Properties | ForEach-Object { [bool]$_.Value }
          $report.passed = -not ($allChecks -contains $false)

          if (-not $report.passed) {
            Write-Host ($report | ConvertTo-Json -Depth 10)
            throw "Final gate report has passed=false after requiring statcast_runtime_available."
          }

          $report | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 "build_reports\windows.json"
          Copy-Item "build_reports\windows.json" "artifacts\windows.json" -Force

          Write-Host "=========================================="
          Write-Host "WINDOWS_NATIVE_GATE = PASS (base checks + statcast_runtime_available)"
          Write-Host "=========================================="

      - name: Upload Windows native artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLB-HR-Windows-Native
          path: |
            artifacts/MLB-HR-Windows-App.zip
            artifacts/MLB-HR-Windows-FULL-CI-FIXTURE.zip
            artifacts/full-release-manifest.json
            artifacts/windows.json
          if-no-files-found: error
